    <h1>Pixel Wildlife</h1>

        <!-- BEGIN WILDLIFE HERO -->
        <section class="wildlife-hero">
            <h2>Moose</h2>

            <!-- MOOSE IMG -->
            <picture>
                <!-- CLOSEUP - MOBILE -->
                <source
                    media="(max-width: 767px)"
                    srcset="../../../../assets/blog_images/week_10A/moose-mobile-768.webp"
                    width="768"
                    height="960">


                <img 
                    src="../../../../assets/blog_images/week_10A/moose-hero-1200.webp"
                    srcset="../../../../assets/blog_images/week_10A/moose-hero-480.webp 480w, 
                            ../../../../assets/blog_images/week_10A/moose-hero-800.webp 800w,
                            ../../../../assets/blog_images/week_10A/moose-hero-1200.webp 1200w"
                    sizes="(min-width: 1100px) 1060px, calc(100vw - 40px)"
                    width="1200"
                    height="675"
                    alt="Pixel art moose walking through water">

            </picture>
            <!-- END MOOSE IMG -->
        </section>
        <!-- END WILDLIFE HERO -->

        <!-- WILDLIFE GALLERY -->
        <section class="wildlife-gallery">
            <h2>Meet the Wildlife</h2>

            <div class="wildlife-grid">
                <figure>
                    <img src="../../../../assets/blog_images/week_10A/moose-gallery.webp"
                        alt="Pixel art moose walking through water"
                        loading="lazy">
                    <figcaption>Moose</figcaption>
                </figure>

                <figure>
                    <img src="../../../../assets/blog_images/week_10A/reindeer-gallery.webp"
                        alt="Pixel art reindeer standing in a snowy landscape"
                        loading="lazy">
                    <figcaption>Reindeer</figcaption>
                </figure>


                <figure>
                    <img src="../../../../assets/blog_images/week_10A/bear-gallery.webp"
                        alt="Pixel art polar bear sitting upright waving with one paw"
                        loading="lazy">
                    <figcaption>Polar Bear</figcaption>
                </figure>

                <figure>
                    <img src="../../../../assets/blog_images/week_10A/eagle-gallery.webp"
                        alt="Pixel art eagle flying over water"
                        loading="lazy">
                    <figcaption>Eagle</figcaption>
                </figure>

                <figure>
                    <img src="../../../../assets/blog_images/week_10A/elk-gallery.webp"
                        alt="Pixel art elk with large antlers"
                        loading="lazy">
                    <figcaption>Elk</figcaption>
                </figure>
            </div>
        </section>
